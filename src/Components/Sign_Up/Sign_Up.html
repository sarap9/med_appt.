<div class="container">
    <div class="signup-grid">
        <h1>Sign Up</h1>
        <form class="signup-form">
            <div class="form-group"><label>Role</label><input type="text" class="form-control" required /></div>
            <div class="form-group"><label>Name</label><input type="text" class="form-control" required /></div>
            <div class="form-group"><label>Phone</label><input type="tel" class="form-control" maxlength="10" required /></div>
            <div class="form-group"><label>Email</label><input type="email" class="form-control" required /></div>
            <div class="form-group"><label>Password</label><input type="password" class="form-control" required /></div>
            <div class="btn-group"><button type="submit" class="btn btn-primary">Submit</button></div>
        </form>
    </div>
</div>
